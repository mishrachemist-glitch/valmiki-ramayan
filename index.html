<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>वाल्मीकि रामायण</title>

<link rel="icon" href="logo.png">

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(to bottom,#7a0000,#1a1a1a);
color:white;
text-align:center;
overflow-x:hidden;
}

.container{
padding:40px 20px;
}

.logo{
width:320px;
max-width:90%;
margin-top:30px;
border-radius:20px;
box-shadow:0 0 25px rgba(255,215,0,0.4);
}

h1{
font-size:48px;
margin-top:20px;
color:#FFD700;
}

.subtitle{
font-size:24px;
margin-top:10px;
}

.shlok{
margin:40px auto;
font-size:26px;
color:#FFD700;
font-weight:bold;
}

.card{
max-width:900px;
margin:30px auto;
padding:25px;
background:rgba(255,255,255,0.08);
border-radius:15px;
}

footer{
margin-top:40px;
padding:20px;
background:rgba(0,0,0,0.3);
}
</style>
</head>

<body>

<div class="container">

<img src="logo.png" class="logo" alt="वाल्मीकि रामायण">

<h1>वाल्मीकि रामायण</h1>

<div class="subtitle">
🚩 जय श्री राम 🚩
</div>

<div class="shlok" id="shlok">
॥ श्रीराम जय राम जय जय राम ॥
</div>

<div class="card">
<h2>📖 स्वागत है</h2>
<p>
महर्षि वाल्मीकि द्वारा रचित रामायण भारतीय संस्कृति,
धर्म, आदर्श और मर्यादा का अमूल्य ग्रंथ है।
</p>
</div>

</div>

<footer>
🚩 वाल्मीकि रामायण 🚩<br>
जय श्री राम
</footer>

<script>
const shloks = [
"॥ श्रीराम जय राम जय जय राम ॥",
"॥ रामो विग्रहवान् धर्मः ॥",
"॥ धर्मो रक्षति रक्षितः ॥",
"॥ सत्यमेव जयते ॥"
];

let i = 0;

setInterval(() => {
i = (i + 1) % shloks.length;
document.getElementById("shlok").innerHTML = shloks[i];
}, 3000);
</script>

</body>
</html>
