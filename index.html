<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>वाल्मीकि रामायण</title>

<link rel="icon" href="logo.png">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:Mangal, Arial, sans-serif;
}

.container{
    position:relative;
    width:100vw;
    height:100vh;
}

.logo{
    width:100%;
    height:100%;
    object-fit:contain;
    background:#000;
}

.text{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    color:#FFD700;
    font-size:32px;
    font-weight:bold;
    text-shadow:0 0 10px #ff9900;
    animation:blink 2s infinite;
}

@keyframes blink{
    0%{opacity:1;}
    50%{opacity:0.5;}
    100%{opacity:1;}
}

</style>
</head>

<body>

<div class="container">

    <img src="logo.png" alt="वाल्मीकि रामायण" class="logo">

    <div class="text">
        🚩 जय श्री राम 🚩
    </div>

</div>

</body>
</html>
