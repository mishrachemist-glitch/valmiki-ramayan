<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valmiki Ramayan | Pro</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0f0f0f;
        color: white;
        overflow-x: hidden;
    }

    /* HERO SECTION */
    .hero {
        height: 100vh;
        background: url("https://upload.wikimedia.org/wikipedia/commons/6/6a/Ram_Mandir_Ayodhya.jpg") center/cover fixed;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    .overlay {
        position: absolute;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.55);
    }

    .hero-text {
        position: relative;
        text-align: center;
        z-index: 2;
        animation: fadeIn 2s ease;
    }

    .hero-text h1 {
        font-size: 40px;
        margin: 0;
    }

    .hero-text p {
        font-size: 18px;
        opacity: 0.9;
    }

    @keyframes fadeIn {
        from {opacity: 0; transform: translateY(20px);}
        to {opacity: 1; transform: translateY(0);}
    }

    /* CONTENT */
    .section {
        padding: 50px 20px;
        text-align: center;
        background: #111;
    }

    .card {
        max-width: 800px;
        margin: auto;
        background: #1c1c1c;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 0 15px rgba(255,255,255,0.05);
    }

    img {
        width: 100%;
        border-radius: 12px;
        margin-top: 15px;
    }

    /* FLOATING FLOWERS */
    .flower {
        position: fixed;
        top: -10px;
        font-size: 20px;
        animation: fall linear infinite;
        opacity: 0.8;
    }

    @keyframes fall {
        to {
            transform: translateY(110vh) rotate(360deg);
        }
    }

    /* BUTTONS */
    .btn {
        padding: 10px 15px;
        border: none;
        margin: 10px;
        border-radius: 8px;
        cursor: pointer;
        background: #b30000;
        color: white;
    }

    .btn:hover {
        background: #ff0000;
    }

    /* AUDIO CONTROL */
    #audioBox {
        position: fixed;
        bottom: 15px;
        right: 15px;
        z-index: 999;
    }

</style>
</head>

<body>

<!-- FLOATING FLOWERS -->
<script>
const emojis = ["🌸","🌺","🌼","🏵️"];
for(let i=0;i<25;i++){
    let f = document.createElement("div");
    f.className = "flower";
    f.style.left = Math.random()*100 + "vw";
    f.style.animationDuration = (3+Math.random()*5) + "s";
    f.innerText = emojis[Math.floor(Math.random()*emojis.length)];
    document.body.appendChild(f);
}
</script>

<!-- HERO -->
<div class="hero">
    <div class="overlay"></div>
    <div class="hero-text">
        <h1>📖 Valmiki Ramayan</h1>
        <p>🏹 Maryada Purushottam Shri Ram</p>
        <button class="btn" onclick="scrollToContent()">Explore</button>
    </div>
</div>

<!-- CONTENT -->
<div class="section" id="content">
    <div class="card">

        <h2>🙏 Ayodhya Ram Mandir</h2>
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/6a/Ram_Mandir_Ayodhya.jpg">

        <p>Ayodhya me sthit divya Ram Mandir, bharatiya sanskriti aur dharm ka pratik hai.</p>

        <h2>🏹 Shri Ram</h2>
        <img src="https://upload.wikimedia.org/wikipedia/commons/4/4e/Rama_with_bow.jpg">

        <p>Prabhu Shri Ram satya, dharma aur maryada ke adarsh hain.</p>

    </div>
</div>

<!-- AUDIO -->
<div id="audioBox">
    <button class="btn" onclick="toggleMusic()">🎵 Bhajan</button>
</div>

<audio id="bgm" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mp3">
</audio>

<script>
function scrollToContent(){
    document.getElementById("content").scrollIntoView({behavior:"smooth"});
}

function toggleMusic(){
    let audio = document.getElementById("bgm");
    if(audio.paused){
        audio.play();
    } else {
        audio.pause();
    }
}
</script>

</body>
</html>
